<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>연락하기 | erkeys 에르키스</title>
    <meta
      name="description"
      content="MODU-C 모두키보드 관련 문의 채널 안내 페이지입니다."
    >
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="contact-page" aria-labelledby="title">
      <nav class="contact-nav" aria-label="페이지 이동">
        <a href="/">Main</a>
      </nav>

      <h1 class="contact-title" id="title">연락하기</h1>
      <p class="contact-lead">문의 사항이 있으시다면, 아래 채널을 이용해 주세요.</p>

      <section class="contact-status" aria-labelledby="status-title">
        <div class="contact-status-head">
          <span class="contact-status-mark" aria-hidden="true">😣</span>
          <span id="status-title">현재 대응 상태</span>
        </div>
        <p>현재 적은 인원으로 MODU-C 잔여분 발송에 모든 힘을 쏟고 있습니다.</p>
        <p>A/S 및 문의 대응에 늦어질 수 있는 점, 고개숙여 사과드립니다.</p>
      </section>

      <nav class="contact-list" aria-label="연락 채널">
        <a class="contact-link primary" href="#">카카오톡 채널</a>
        <a class="contact-link" href="#">와디즈 메이커페이지</a>
        <a class="contact-link disabled" aria-disabled="true">네이버 스마트스토어</a>
      </nav>
    </main>
  </body>
</html>
