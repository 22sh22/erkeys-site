<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MODU-C 키 테스트 | erkeys 에르키스</title>
    <meta
      name="description"
      content="MODU-C 기본 키맵과 Lower 키맵의 입력을 확인하는 erkeys 공식 키 테스트입니다."
    >
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    >
    <link rel="stylesheet" href="keymap.css">
  </head>
  <body>
    <main class="page" aria-labelledby="page-title">
      <nav class="page-nav" aria-label="상위 페이지">
        <a href="/user-guide/">사용 가이드</a>
        <span aria-hidden="true">/</span>
        <span>키 테스트</span>
      </nav>

      <header class="page-header">
        <p class="brand-label">erkeys 에르키스</p>
        <h1 id="page-title">MODU-C 키 테스트</h1>
      </header>

      <section class="keymap-comparison" aria-label="기본 및 Lower 키맵 비교">
        <article class="layer-panel" aria-labelledby="default-title">
          <header class="layer-header">
            <p class="layer-index">01</p>
            <div>
              <h2 id="default-title">기본 키맵</h2>
              <p>일반 입력 상태</p>
            </div>
          </header>
          <div class="keyboard-viewport" aria-label="기본 키맵">
            <div class="keyboard" id="default-keyboard" data-layer="default"></div>
          </div>
        </article>

        <article class="layer-panel" aria-labelledby="lower-title">
          <header class="layer-header">
            <p class="layer-index">02</p>
            <div>
              <h2 id="lower-title">Lower 키맵</h2>
              <p>보조 레이어 입력</p>
            </div>
          </header>
          <div class="keyboard-viewport" aria-label="Lower 키맵">
            <div class="keyboard" id="lower-keyboard" data-layer="lower"></div>
          </div>
        </article>
      </section>

      <aside class="notes" aria-label="키맵 표기 안내">
        <p><span class="sample-key inherited" aria-hidden="true"></span>회색 키는 기본 키맵의 동작을 그대로 사용합니다.</p>
        <p><span class="sample-key optional" aria-hidden="true"></span>점선 B키는 추가 B키 모듈입니다.</p>
      </aside>

    </main>

    <script src="keymap.js" defer></script>
  </body>
</html>
